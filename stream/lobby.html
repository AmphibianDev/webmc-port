<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebMC — live</title>
<style>
  body { margin: 0; background: #0c0c0e; color: #e4e4e4; font: 15px/1.6 ui-monospace, Menlo, monospace; }
  main { max-width: 780px; margin: 0 auto; padding: 12vh 18px 60px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .card { border: 1px solid #262a2f; background: #121316; border-radius: 6px; padding: 18px 20px; margin: 18px 0; }
  .live { color: #7f7; } .idle { color: #888; }
  a.go { display: inline-block; margin-top: 12px; background: #2a5c3a; border: 1px solid #3d7d51;
         color: #fff; text-decoration: none; padding: 11px 20px; border-radius: 4px; font-size: 16px; }
  a.go:hover { background: #347045; }
  code { color: #cc9; } .muted { color: #888; font-size: 13px; }
  button { font: inherit; background: #23252a; border: 1px solid #3a3f46; color: #eee;
           padding: 8px 14px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>WebMC <span class="muted">· live from someone's own machine</span></h1>
  <div class="card" id="card">
    <p class="idle" id="line">checking…</p>
    <a class="go" id="join" style="display:none" href="/watch">▶ Join the session</a>
    <p class="muted" id="detail"></p>
  </div>
  <p class="muted">
    The picture travels directly between the host's browser and yours; this page only tells you whether
    somebody is streaming. Nothing is recorded and nothing is stored.
  </p>
  <button id="again">check again</button>
</main>
<script>
  const el = (id) => document.getElementById(id);
  function check() {
    el("line").textContent = "checking…";
    el("line").className = "idle";
    fetch("/health", { cache: "no-store" }).then((r) => r.json()).then((health) => {
      const live = health.host;
      el("line").textContent = live
        ? "Live now — " + (health.viewers.length ? health.viewers.length + " watching" : "waiting for viewers")
        : "Nobody is streaming right now";
      el("line").className = live ? "live" : "idle";
      el("join").style.display = live ? "inline-block" : "none";
      el("detail").textContent = live
        ? "You can watch straight away; press Take control on the next page to play."
        : "Ask the host to run stream/host.sh and share a window.";
    }).catch(() => {
      el("line").textContent = "This page is not being served by the stream server";
      el("line").className = "idle";
      el("detail").textContent = "Run stream/host.sh on the machine with the game.";
    });
  }
  el("again").addEventListener("click", check);
  check();
  setInterval(check, 5000);
</script>
</body>
</html>
