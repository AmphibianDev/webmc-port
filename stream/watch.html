<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebMC — playing a stream</title>
<style>
  body { margin: 0; background: #000; color: #ddd; font: 14px/1.5 ui-monospace, Menlo, monospace; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }
  video { width: 100%; background: #000; border: 1px solid #222; display: block; outline: none; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  button { font: inherit; padding: 7px 12px; background: #23252a; border: 1px solid #3a3f46;
           color: #eee; border-radius: 3px; cursor: pointer; }
  button.go { background: #2a5c3a; border-color: #3d7d51; }
  .muted { color: #888; } .ok { color: #8c8; } .err { color: #e88; }
  pre { background: #0a0a0a; border: 1px solid #222; padding: 8px; max-height: 160px; overflow: auto; }
</style>
</head>
<body>
<main>
  <video id="screen" autoplay playsinline tabindex="0"></video>
  <div class="bar">
    <button id="control" class="go">Take control</button>
    <span id="state" class="muted">connecting…</span>
    <span class="muted" id="stats"></span>
  </div>
  <p class="muted">
    Fullscreen for a better picture. While you have control, your keyboard and mouse go to the host's
    window — press <b>Esc</b> in the page to hand it back (the game keeps its own Esc).
  </p>
  <details><summary class="muted">log</summary><pre id="log"></pre></details>
</main>
<script>
  const el = (id) => document.getElementById(id);
  const log = (line) => { el("log").textContent += line + "\n"; };
  const peer = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  const socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/signal");
  let control = false;
  let channel = null;

  socket.addEventListener("open", () => { log("connected"); socket.send(JSON.stringify({ t: "join" })); });
  socket.addEventListener("message", async (event) => {
    const message = JSON.parse(event.data);
    if (message.t === "offer") {
      await peer.setRemoteDescription(message.sdp);
      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);
      socket.send(JSON.stringify({ t: "answer", sdp: peer.localDescription }));
      el("state").textContent = "waiting for the host's picture…";
      socket.send(JSON.stringify({ t: "join" }));
      el("state").className = "muted";
    } else if (message.t === "candidate") {
      if (message.candidate) { try { await peer.addIceCandidate(message.candidate); } catch (error) {} }
    } else if (message.t === "sharing") {
      screenWidth = message.width || screenWidth;
      screenHeight = message.height || screenHeight;
      if (message.on) { log("the host is sharing " + screenWidth + "x" + screenHeight); }
    } else if (message.t === "host-gone") {
      el("state").textContent = "the host stopped sharing";
      el("state").className = "err";
    }
  });

  peer.addEventListener("track", (event) => {
    el("screen").srcObject = event.streams[0];
    el("state").textContent = "live";
    el("state").className = "ok";
  });
  peer.addEventListener("icecandidate", (event) => {
    if (event.candidate) { socket.send(JSON.stringify({ t: "candidate", candidate: event.candidate })); }
  });
  peer.addEventListener("connectionstatechange", () => log("connection: " + peer.connectionState));

  function sendInput(event) {
    if (!control || socket.readyState !== WebSocket.OPEN) { return; }
    socket.send(JSON.stringify({ t: "input", event }));
  }

  const video = el("screen");
  video.addEventListener("mousemove", (event) => {
    const box = video.getBoundingClientRect();
    sendInput({ t: "move",
                x: Math.round(((event.clientX - box.left) / box.width) * screenWidth),
                y: Math.round(((event.clientY - box.top) / box.height) * screenHeight) });
  });
  video.addEventListener("mousedown", (event) => { event.preventDefault(); sendInput(mouseEvent("button", event, true)); });
  video.addEventListener("mouseup", (event) => { sendInput(mouseEvent("button", event, false)); });
  video.addEventListener("contextmenu", (event) => event.preventDefault());
  video.addEventListener("wheel", (event) => {
    event.preventDefault();
    sendInput({ t: "scroll", dx: Math.sign(event.deltaX), dy: Math.sign(event.deltaY) });
  }, { passive: false });

  let screenWidth = 1920, screenHeight = 1080;
  function mouseEvent(kind, event, down) {
    const box = video.getBoundingClientRect();
    return { t: kind, down, button: event.button,
             x: Math.round(((event.clientX - box.left) / box.width) * screenWidth),
             y: Math.round(((event.clientY - box.top) / box.height) * screenHeight) };
  }

  window.addEventListener("keydown", (event) => {
    if (event.code === "Escape" && control) { setControl(false); return; }
    if (!control) { return; }
    event.preventDefault();
    sendInput({ t: "key", code: event.code, down: true });
  });
  window.addEventListener("keyup", (event) => {
    if (!control) { return; }
    event.preventDefault();
    sendInput({ t: "key", code: event.code, down: false });
  });

  function setControl(on) {
    control = on;
    el("control").textContent = on ? "Hand back control (Esc)" : "Take control";
    el("control").className = on ? "" : "go";
    el("state").textContent = on ? "you have control" : "watching";
    el("state").className = on ? "ok" : "muted";
    if (on) { video.focus(); }
  }
  el("control").addEventListener("click", () => setControl(!control));
  video.addEventListener("dblclick", () => video.requestFullscreen && video.requestFullscreen());

  // the host's screen size, so a click lands where it looks like it should
  socket.addEventListener("message", (event) => {
    const message = JSON.parse(event.data);
    if (message.t === "screen") { screenWidth = message.width; screenHeight = message.height; }
  });
  fetch("/health").then((r) => r.json()).then((health) => {
    log("server: host " + (health.host ? "present" : "absent") + ", input " + (health.input ? "on" : "off"));
  }).catch(() => {});

  setInterval(() => {
    if (peer.connectionState !== "connected") { return; }
    peer.getStats().then((report) => {
      report.forEach((entry) => {
        if (entry.type === "inbound-rtp" && entry.kind === "video") {
          const mbps = ((entry.bytesReceived * 8) / 1_000_000).toFixed(1);
          el("stats").textContent = entry.frameWidth + "×" + entry.frameHeight + " · " + (entry.framesPerSecond || 0)
            + " fps · received " + mbps + " Mb";
        }
      });
    }).catch(() => {});
  }, 2000);
</script>
</body>
</html>
