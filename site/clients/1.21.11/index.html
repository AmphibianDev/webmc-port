<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Minecraft 1.21.11</title>
<!-- Written by tools/pack_client.py. The client itself is the chunks next to this page. -->
<style>

  :root {
    /* LoadingOverlay's background, and the two colours it draws with. */
    --webmc-bg: #000;
    --webmc-text: #ffffff;
    --webmc-shadow: #3f3f3f;
    --webmc-bar-track: rgba(255, 255, 255, 0.22);
    --webmc-bar-fill: #ffffff;
    --webmc-scale: 2;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--webmc-bg); overflow: hidden; }
  /* The window the game draws into. Empty until the engine mounts something. */
  #x11-wasm-root { position: absolute; inset: 0; }
  #webmc-boot {
    position: fixed; inset: 0; z-index: 2147483646; background: var(--webmc-bg);
    display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    font-size: calc(8px * var(--webmc-scale));
    line-height: calc(9px * var(--webmc-scale));
    letter-spacing: 0; text-rendering: geometricPrecision; image-rendering: pixelated;
    -webkit-font-smoothing: none; -moz-osx-font-smoothing: grayscale;
    user-select: none; cursor: default; transition: opacity .25s linear; opacity: 1;
  }
  #webmc-boot.gone { opacity: 0; pointer-events: none; }
  #webmc-boot .panel { text-align: center; }
  #webmc-boot .status {
    color: var(--webmc-text); text-shadow: calc(1px * var(--webmc-scale)) calc(1px * var(--webmc-scale)) 0 var(--webmc-shadow);
    margin: 0 0 calc(10px * var(--webmc-scale));
  }
  /* 200 x 2 at the game's scale: a track with a fill, both crisp, no border radius, no animation
     beyond a width change - the overlay the game draws has none either. */
  #webmc-boot .bar {
    width: calc(200px * var(--webmc-scale)); height: calc(2px * var(--webmc-scale));
    margin: 0 auto; background: var(--webmc-bar-track); overflow: hidden;
  }
  #webmc-boot .bar { position: relative; }
  #webmc-boot .bar > i {
    display: block; width: 0; height: 100%;
    /* the fill never goes backwards: the page uses the highest value it has seen, so a step that
       reports less than the last one cannot make the bar jump back */
    background: linear-gradient(90deg, var(--webmc-bar-fill), #d8f0da);
    transition: width .18s linear;
  }
  #webmc-boot .logo {
    font-size: calc(14px * var(--webmc-scale)); margin: 0 0 calc(14px * var(--webmc-scale));
    color: var(--webmc-text); letter-spacing: calc(2px * var(--webmc-scale));
    text-shadow: calc(2px * var(--webmc-scale)) calc(2px * var(--webmc-scale)) 0 var(--webmc-shadow);
  }
  #webmc-boot .version { color: #ffffff; opacity: .5; margin: calc(6px * var(--webmc-scale)) 0 0;
    font-size: calc(8px * var(--webmc-scale));
    text-shadow: calc(1px * var(--webmc-scale)) calc(1px * var(--webmc-scale)) 0 var(--webmc-shadow); }
  #webmc-boot .note {
    color: var(--webmc-text); opacity: .55; margin: calc(8px * var(--webmc-scale)) 0 0;
    font-size: calc(8px * var(--webmc-scale));
    text-shadow: calc(1px * var(--webmc-scale)) calc(1px * var(--webmc-scale)) 0 var(--webmc-shadow);
  }
  /* The pre-1.13 screen, for anyone who prefers it: the dirt background. Drawn with CSS (a base tone,
     a 16-pixel tile of two tones, and a sparse speckle) so no Mojang texture has to ship with this
     file; a build that has the real texture passes --dirt and it replaces this one entirely. */
  #webmc-boot.dirt {
    background-color: #866043;
    background-image:
      var(--webmc-dirt, none),
      repeating-conic-gradient(from 0deg, #79512f 0% 25%, #8b6547 25% 50%),
      radial-gradient(circle at 30% 30%, #6f4a2b 1.5px, transparent 2px),
      radial-gradient(circle at 70% 65%, #9a7250 1.5px, transparent 2px);
    background-size: calc(16px * var(--webmc-scale)) calc(16px * var(--webmc-scale)),
                     calc(8px * var(--webmc-scale)) calc(8px * var(--webmc-scale)),
                     calc(16px * var(--webmc-scale)) calc(16px * var(--webmc-scale)),
                     calc(16px * var(--webmc-scale)) calc(16px * var(--webmc-scale));
    background-position: 0 0, 0 0, 0 0, calc(8px * var(--webmc-scale)) calc(4px * var(--webmc-scale));
  }
  #webmc-boot.dirt .status, #webmc-boot.dirt .note { color: #ffffff; }

  html, body { height: 100%; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: #000; color: #ddd; font: 14px/1.6 ui-monospace, Menlo, monospace; text-align: center; }
  #start button { font: inherit; font-size: 17px; padding: 14px 26px; background: #2a5c3a; color: #fff;
                   border: 1px solid #3d7d51; border-radius: 5px; cursor: pointer; }
  #start p { max-width: 38rem; color: #888; }
</style>
</head>
<body>
<div id="start">
  <div>
    <h1 style="font-size:20px;margin:0 0 10px">Minecraft 1.21.11</h1>
    <p id="why">The client is {size} MB and loads once; after that it comes from this browser's cache.</p>
    <button id="go">▶ Play</button>
    <p id="note">Compiled from the official client by this project's build job. Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.</p>
  </div>
</div>
<div id="webmc-boot">
  <div class="panel">
    <p class="logo" id="webmc-boot-logo">MINECRAFT</p>
    <p class="status">Loading...</p>
    <div class="bar"><i></i></div>
    <p class="version" id="webmc-boot-version"></p>
    <p class="note"></p>
  </div>
</div>
<script>
(function () {
  "use strict";
  var root = document.getElementById("webmc-boot");
  var fill = root.querySelector(".bar > i");
  var status = root.querySelector(".status");
  var note = root.querySelector(".note");
  var style = document.documentElement.style;
  var done = false;
  var value = 0;
  var creep = null;

  /* The game's GUI scale, computed the way it computes it for a small window: the largest whole
   * multiple that still leaves 320 x 240 logical pixels on screen, at least 1 and at most 4. */
  function rescale() {
    var scale = Math.max(1, Math.min(4, Math.floor(Math.min(window.innerWidth / 320, window.innerHeight / 240))));
    style.setProperty("--webmc-scale", String(scale));
  }

  var api = {
    show: function (text) {
      root.hidden = false;
      if (text) { status.textContent = text; }
    },
    /* Monotonic: a step that reports less progress than the last one is ignored rather than shown, which
     * is what "the bar went backwards" always is - two things reporting progress on different scales. */
    progress: function (fraction, text) {
      api.show();
      var next = Math.max(0, Math.min(1, Number(fraction) || 0));
      if (next > value) { value = next; }
      fill.style.width = (value * 100).toFixed(2) + "%";
      if (text) { status.textContent = text; }
    },
    /* The version being loaded, in the corner, because "Loading…" with no name is a worse wait. */
    version: function (text) {
      var line = document.getElementById("webmc-boot-version");
      if (line) { line.textContent = text || ""; }
    },
    note: function (text) { api.show(); note.textContent = text || ""; },
    ready: function () {
      if (done) { return; }
      done = true;
      if (creep) { clearInterval(creep); creep = null; }
      api.progress(1);
      /* The fade is the only animation, and it is short: the game's own title screen is what the
       * player should be looking at, not this. */
      root.classList.add("gone");
      setTimeout(function () { root.hidden = true; }, 300);
      document.dispatchEvent(new CustomEvent("webmc:booted"));
    },
    get progressValue() { return value; }
  };

  /* No progress reporting? Then the bar creeps toward -50%, which is what the game does while it has
   * nothing to report either (its overlay has the same shape of lie: an indeterminate creep that
   * stops short of the end). It must be replaced by webmcBoot.ready() to reach the end. */
  function beginCreep() {
    if (creep) { return; }
    creep = setInterval(function () {
      if (done) { return; }
      value += (0.5 - value) * 0.02;
      fill.style.width = (value * 100).toFixed(2) + "%";
    }, 100);
  }

  document.addEventListener("webmc:ready", api.ready);
  window.addEventListener("resize", rescale);
  rescale();
  api.show();
  if (window.webmcBootHideOnLoad) { window.addEventListener("load", api.ready); }
  beginCreep();
  window.webmcBoot = api;
})();
</script>

<script>
/* Start the client: fetch the chunks, check them, hand the blob to an iframe. */
(function () {
  "use strict";
  var manifestName = "manifest.json";
  var frame = document.getElementById("frame");
  var start = document.getElementById("start");
  var go = document.getElementById("go");
  var why = document.getElementById("why");

  function hex(bytes) {
    return Array.prototype.map.call(new Uint8Array(bytes), function (b) {
      return b.toString(16).padStart(2, "0");
    }).join("");
  }

  async function digest(bytes) {
    if (!window.crypto || !crypto.subtle) { return null; }   // an insecure origin has no crypto
    return hex(await crypto.subtle.digest("SHA-256", bytes));
  }

  async function fetchChecked(url, expected, label) {
    var response = await fetch(url, { cache: "force-cache" });
    if (!response.ok) { throw new Error(label + ": HTTP " + response.status); }
    var bytes = new Uint8Array(await response.arrayBuffer());
    var got = await digest(bytes);
    if (expected && got && got !== expected) {
      throw new Error(label + ": the bytes do not match their hash - the transfer was corrupted");
    }
    return bytes;
  }

  async function play() {
    go.disabled = true;
    try {
      var manifest = await (await fetch(manifestName, { cache: "force-cache" })).json();
      var parts = new Array(manifest.chunks.length);
      var seen = 0;
      if (window.webmcBoot) {
        window.webmcBoot.version(manifest.title);
        window.webmcBoot.progress(0, "Loading " + manifest.title);
      }
      /* Every chunk at once. They are independent files with a hash each, and fetching them in sequence
       * made the wait the sum of the pieces when it can be the largest one: six chunks of ~18 MB take as
       * long as one on a decent link. Progress is aggregated so the bar still moves smoothly. */
      await Promise.all(manifest.chunks.map(async function (chunk, index) {
        var bytes = await fetchChecked(chunk.path, chunk.sha256, chunk.path);
        parts[index] = bytes;
        seen += bytes.length;
        if (window.webmcBoot) {
          window.webmcBoot.progress(seen / manifest.total, "Loading " + manifest.title);
        }
        why.textContent = (seen / 1048576).toFixed(1) + " / " + (manifest.total / 1048576).toFixed(1) + " MB";
      }));
      var blob = new Blob(parts, { type: "text/html" });
      if (await digest(await blob.arrayBuffer()) !== manifest.sha256 && manifest.sha256) {
        throw new Error("the reassembled client does not match its hash");
      }
      frame.src = URL.createObjectURL(blob);
      frame.style.display = "block";
      start.style.display = "none";
      frame.focus();
      /* The client draws its own loading screen inside the iframe; our boot screen is already behind it
       * and has faded by the time the frame paints, so the hand-over is invisible. */
      if (window.webmcBoot) { window.webmcBoot.ready(); }
    } catch (error) {
      go.disabled = false;
      why.textContent = "could not start: " + (error && error.message ? error.message : error);
      why.className = "err";
    }
  }

  go.addEventListener("click", play);
  /* Autostart when the browser already has every chunk cached: no click needed, no download. */
  if (typeof caches !== "undefined") {
    caches.open("webmc-clients-v2").then(function () { return play(); }).catch(function () {});
  }
})();
</script>
