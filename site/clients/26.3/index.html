<script>
(function () {
  "use strict";
  var root = document.getElementById("webmc-boot");
  var fill = root.querySelector(".bar > i");
  var status = root.querySelector(".status");
  var note = root.querySelector(".note");
  var style = document.documentElement.style;
  var done = false;
  var value = 0;
  var creep = null;

  /* The game's GUI scale, computed the way it computes it for a small window: the largest whole
   * multiple that still leaves 320 x 240 logical pixels on screen, at least 1 and at most 4. */
  function rescale() {
    var scale = Math.max(1, Math.min(4, Math.floor(Math.min(window.innerWidth / 320, window.innerHeight / 240))));
    style.setProperty("--webmc-scale", String(scale));
  }

  /* The engine reports its progress with its own words, and its words carry its own name: a player read
   * "Starting Gaius Client 1.21.11" on this screen, which is somebody else's product on our loading page. The
   * engine's text is still useful - it says what it is doing - so the name is replaced rather than the message
   * thrown away, and the version is left alone. */
  var ENGINE_NAMES = /(?:gaius|eaglercraft(?:x)?|eagler|eaglerforge|lax1dude|typetheory|browsercraft)[a-z0-9_.-]*/gi;
  var ATTRIBUTION = /not affiliated|independent project|independent browser software/i;
  function clean(text) {
    var line = String(text);
    // An attribution sentence is not progress, and rewriting the name inside it produces a sentence that is
    // worse than no sentence ("Minecraft is not affiliated with Mojang"). The credits live in CREDITS.md; the
    // loading screen keeps the last real progress line instead.
    if (ATTRIBUTION.test(line)) { return ""; }
    return line.replace(ENGINE_NAMES, "Minecraft").replace(/\s+/g, " ").trim();
  }

  /* ------------------------------------------------------------------------------------------------------------
   * The identity a server sees.
   *
   * A browser client has no Mojang session, so it has to be an offline-mode player: a name, and the UUID an
   * offline server would derive from that name. That derivation is the whole trick - a server in offline mode
   * computes UUID.nameUUIDFromBytes("OfflinePlayer:" + name) and expects the client to send exactly that. Send a
   * random UUID instead and some servers refuse the login; send this one and an offline server accepts the join
   * with no session at all. The engine's own shell does this, and our page strips that shell - which is why a
   * client of ours could not join anything: it had no identity to send.
   *
   * The MD5 below is the engine's (MIT, credited in CREDITS.md), kept byte for byte so the UUID matches.
   * ---------------------------------------------------------------------------------------------------------- */
  var PLAYER_KEY = "webmc.player";

  function md5(input) {
    var shifts = [
      7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
      5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
      4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
      6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21
    ];
    var table = new Uint32Array(64);
    for (var i = 0; i < 64; i++) { table[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296); }
    var length = input.length;
    var padded = new Uint8Array((((length + 8) >>> 6) + 1) * 64);
    padded.set(input);
    padded[length] = 0x80;
    var view = new DataView(padded.buffer);
    view.setUint32(padded.length - 8, (length * 8) >>> 0, true);
    view.setUint32(padded.length - 4, Math.floor(length / 536870912), true);
    var a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
    for (var offset = 0; offset < padded.length; offset += 64) {
      var a = a0, b = b0, c = c0, d = d0;
      for (var j = 0; j < 64; j++) {
        var f, g;
        if (j < 16) { f = (b & c) | (~b & d); g = j; }
        else if (j < 32) { f = (d & b) | (~d & c); g = (5 * j + 1) % 16; }
        else if (j < 48) { f = b ^ c ^ d; g = (3 * j + 5) % 16; }
        else { f = c ^ (b | ~d); g = (7 * j) % 16; }
        var sum = (a + f + table[j] + view.getUint32(offset + g * 4, true)) | 0;
        a = d; d = c; c = b;
        b = (b + ((sum << shifts[j]) | (sum >>> (32 - shifts[j])))) | 0;
      }
      a0 = (a0 + a) | 0; b0 = (b0 + b) | 0; c0 = (c0 + c) | 0; d0 = (d0 + d) | 0;
    }
    var out = new Uint8Array(16);
    var outView = new DataView(out.buffer);
    [a0, b0, c0, d0].forEach(function (word, index) { outView.setUint32(index * 4, word >>> 0, true); });
    return out;
  }

  function offlineUuid(name) {
    var text = "OfflinePlayer:" + name;
    var bytes = new Uint8Array(text.length);
    for (var i = 0; i < text.length; i++) { bytes[i] = text.charCodeAt(i) & 0xff; }
    var digest = md5(bytes);
    digest[6] = (digest[6] & 0x0f) | 0x30;
    digest[8] = (digest[8] & 0x3f) | 0x80;
    return Array.prototype.map.call(digest, function (byte) {
      return byte.toString(16).padStart(2, "0");
    }).join("");
  }

  function savedName() {
    try { return localStorage.getItem(PLAYER_KEY) || ""; } catch (error) { return ""; }
  }

  function keepName(name) {
    try { localStorage.setItem(PLAYER_KEY, name); } catch (error) { /* private mode: the name lasts this tab */ }
  }

  /* What the game asks for, in the shape its own shell provides it. `firstRun` is true when no name is saved, so
   * the engine's own profile screen opens and the player types one; everything here is the offline path.
   *
   * The skin hooks are present but empty: without a skin the game sends no textures property, which is exactly
   * what an offline player has. A skin picked in the game is remembered in this browser and applied on the next
   * join, because the engine applies a change to the running client when the profile screen closes. */
  function installIdentity() {
    // A page that keeps the engine's own shell already has one of these; ours fills the gap it leaves behind.
    if (globalThis.__gaiusProfile) { return; }
    var name = savedName();
    var profile = {
      firstRun: !name,
      pick: { state: "idle" },
      savedSkin: function () { return ""; },
      savedSkinModel: function () { return "classic"; },
      texturesValue: function () { return ""; },
      pickSkin: function () { /* skins are optional; nothing to pick from here */ },
      apply: function (requested) {
        var wanted = String(requested || name || "").trim();
        if (!/^[A-Za-z0-9_]{1,16}$/.test(wanted)) {
          return { ok: false, error: "Use 1-16 letters, numbers or underscores." };
        }
        name = wanted;
        keepName(wanted);
        var uuid = offlineUuid(wanted);
        try {
          var session = {};
          try { session = JSON.parse(sessionStorage.getItem("gaius.session") || "{}") || {}; } catch (error) { session = {}; }
          session.username = wanted;
          session.uuid = uuid;
          sessionStorage.setItem("gaius.session", JSON.stringify(session));
        } catch (error) { /* the game keeps the identity in memory either way */ }
        globalThis.__gaiusSkinDescriptor = null;
        return { ok: true, uuid: uuid };
      }
    };
    globalThis.__gaiusProfile = profile;
    globalThis.__gaiusSessionMode = globalThis.__gaiusSessionMode || "offline";
    if (name) { profile.firstRun = false; profile.apply(name); }
    globalThis.__webmcIdentity = { name: name || "", offline: true };
  }

  installIdentity();

  var api = {
    show: function (text) {
      root.hidden = false;
      var line = text ? clean(text) : "";
      if (line) { status.textContent = line; }
    },
    /* Monotonic: a step that reports less progress than the last one is ignored rather than shown, which
     * is what "the bar went backwards" always is - two things reporting progress on different scales. */
    progress: function (fraction, text) {
      api.show();
      var next = Math.max(0, Math.min(1, Number(fraction) || 0));
      if (next > value) { value = next; }
      fill.style.width = (value * 100).toFixed(2) + "%";
      var line = text ? clean(text) : "";
      if (line) { status.textContent = line; }
    },
    /* The version being loaded, in the corner, because "Loading…" with no name is a worse wait. */
    version: function (text) {
      var line = document.getElementById("webmc-boot-version");
      if (line) { line.textContent = text || ""; }
    },
    note: function (text) { api.show(); note.textContent = text || ""; },
    ready: function () {
      if (done) { return; }
      done = true;
      if (creep) { clearInterval(creep); creep = null; }
      api.progress(1);
      /* The fade is the only animation, and it is short: the game's own title screen is what the
       * player should be looking at, not this. */
      root.classList.add("gone");
      setTimeout(function () { root.hidden = true; }, 300);
      document.dispatchEvent(new CustomEvent("webmc:booted"));
    },
    get progressValue() { return value; }
  };

  /* No progress reporting? Then the bar creeps toward -50%, which is what the game does while it has
   * nothing to report either (its overlay has the same shape of lie: an indeterminate creep that
   * stops short of the end). It must be replaced by webmcBoot.ready() to reach the end. */
  function beginCreep() {
    if (creep) { return; }
    creep = setInterval(function () {
      if (done) { return; }
      value += (0.5 - value) * 0.02;
      fill.style.width = (value * 100).toFixed(2) + "%";
    }, 100);
  }

  document.addEventListener("webmc:ready", api.ready);
  window.addEventListener("resize", rescale);
  rescale();
  api.show();
  if (window.webmcBootHideOnLoad) { window.addEventListener("load", api.ready); }
  beginCreep();
  window.webmcBoot = api;
})();
</script>

      if (next > value) { value = next; }
      fill.style.width = (value * 100).toFixed(2) + "%";
      var line = text ? clean(text) : "";
      if (line) { status.textContent = line; }
    },
    /* The version being loaded, in the corner, because "Loading…" with no name is a worse wait. */
    version: function (text) {
      var line = document.getElementById("webmc-boot-version");
      if (line) { line.textContent = text || ""; }
    },
    note: function (text) { api.show(); note.textContent = text || ""; },
    ready: function () {
      if (done) { return; }
      done = true;
      if (creep) { clearInterval(creep); creep = null; }
      api.progress(1);
      /* The fade is the only animation, and it is short: the game's own title screen is what the
       * player should be looking at, not this. */
      root.classList.add("gone");
      setTimeout(function () { root.hidden = true; }, 300);
      document.dispatchEvent(new CustomEvent("webmc:booted"));
    },
    get progressValue() { return value; }
  };

  /* No progress reporting? Then the bar creeps toward -50%, which is what the game does while it has
   * nothing to report either (its overlay has the same shape of lie: an indeterminate creep that
   * stops short of the end). It must be replaced by webmcBoot.ready() to reach the end. */
  function beginCreep() {
    if (creep) { return; }
    creep = setInterval(function () {
      if (done) { return; }
      value += (0.5 - value) * 0.02;
      fill.style.width = (value * 100).toFixed(2) + "%";
    }, 100);
  }

  document.addEventListener("webmc:ready", api.ready);
  window.addEventListener("resize", rescale);
  rescale();
  api.show();
  if (window.webmcBootHideOnLoad) { window.addEventListener("load", api.ready); }
  beginCreep();
  window.webmcBoot = api;
})();

</script>
<script>
/* Start the client: fetch the chunks, check them, hand the blob to an iframe. */
(function () {
  "use strict";
  var manifestName = "manifest.json";
  var frame = document.getElementById("frame");
  var start = document.getElementById("start");
  var go = document.getElementById("go");
  var why = document.getElementById("why");

  function hex(bytes) {
    return Array.prototype.map.call(new Uint8Array(bytes), function (b) {
      return b.toString(16).padStart(2, "0");
    }).join("");
  }

  async function digest(bytes) {
    if (!window.crypto || !crypto.subtle) { return null; }   // an insecure origin has no crypto
    return hex(await crypto.subtle.digest("SHA-256", bytes));
  }

  async function fetchChecked(url, expected, label) {
    var response = await fetch(url, { cache: "force-cache" });
    if (!response.ok) { throw new Error(label + ": HTTP " + response.status); }
    var bytes = new Uint8Array(await response.arrayBuffer());
    var got = await digest(bytes);
    if (expected && got && got !== expected) {
      throw new Error(label + ": the bytes do not match their hash - the transfer was corrupted");
    }
    return bytes;
  }

  function concatParts(parts) {
    var size = parts.reduce(function (total, part) { return total + part.length; }, 0);
    var out = new Uint8Array(size);
    var at = 0;
    parts.forEach(function (part) { out.set(part, at); at += part.length; });
    return out;
  }

  /* One script tag into the client's head, by bytes: the page is 100 MB and turning it into a string to run a
   * replace on it is the one thing that would make this slow. */
  function withBridge(bytes, bridge) {
    var needle = new TextEncoder().encode("<head>");
    var at = -1;
    outer:
    for (var i = 0; i < bytes.length - needle.length; i++) {
      for (var j = 0; j < needle.length; j++) {
        if (bytes[i + j] !== needle[j]) { continue outer; }
      }
      at = i;
      break;
    }
    if (at < 0) { return bytes; }
    var lines = [
      "<head><script>/* WebMC: the tunnel this player chose. */",
      "globalThis.__gaiusBridgeUrl = " + JSON.stringify(bridge.replace(/\/$/, "") + "/tunnel") + ";",
      "globalThis.__gaiusBridgeUrls = [globalThis.__gaiusBridgeUrl];",
      "<\/script>"   /* escaped: a literal closing tag would end this page's own script element */
    ];
    var script = new TextEncoder().encode(lines.join("\n"));
    // the injected script replaces the "<head>" it is spliced onto, so the result is that much shorter
    var out = new Uint8Array(bytes.length + script.length - needle.length);
    out.set(bytes.subarray(0, at), 0);
    out.set(script, at);
    out.set(bytes.subarray(at + needle.length), at + script.length);
    return out;
  }

  async function play() {
    go.disabled = true;
    try {
      var manifest = await (await fetch(manifestName, { cache: "force-cache" })).json();
      var parts = new Array(manifest.chunks.length);
      var seen = 0;
      if (window.webmcBoot) {
        window.webmcBoot.version(manifest.title + (manifest.mods && manifest.mods.length
          ? " — with " + manifest.mods.join(", ") + " baked in" : ""));
        window.webmcBoot.progress(0, "Loading " + manifest.title);
      }
      /* Every chunk at once. They are independent files with a hash each, and fetching them in sequence
       * made the wait the sum of the pieces when it can be the largest one: six chunks of ~18 MB take as
       * long as one on a decent link. Progress is aggregated so the bar still moves smoothly. */
      await Promise.all(manifest.chunks.map(async function (chunk, index) {
        var bytes = await fetchChecked(chunk.path, chunk.sha256, chunk.path);
        parts[index] = bytes;
        seen += bytes.length;
        if (window.webmcBoot) {
          window.webmcBoot.progress(seen / manifest.total, "Loading " + manifest.title);
        }
        why.textContent = (seen / 1048576).toFixed(1) + " / " + (manifest.total / 1048576).toFixed(1) + " MB";
      }));
      /* The multiplayer setting is the player's, not the build's, so it is applied here at load time rather
       * than baked in: a gateway in ?bridge= (or ?gateway=), or the one saved in this browser. Two lineages,
       * two places to put it, and both are the client's own documented switch. */
      var bridge = new URLSearchParams(location.search).get("bridge")
                 || new URLSearchParams(location.search).get("gateway")
                 || (function () { try { return localStorage.getItem("webmc.gateway") || ""; } catch (e) { return ""; } })();
      var assembled = concatParts(parts);
      if (bridge) {
        try { localStorage.setItem("eagler26.goldproxy", JSON.stringify({ gateway: bridge })); } catch (e) {}
        assembled = withBridge(assembled, bridge);
        if (window.webmcBoot) { window.webmcBoot.progress(1, "Multiplayer: " + bridge); }
      }
      var blob = new Blob([assembled], { type: "text/html" });
      /* A build that had a mod set baked in says so before the client opens, because that is the difference
       * between a modded build and a build that silently ignored the mods. */
      if (manifest.mods && manifest.mods.length && window.webmcBoot) {
        window.webmcBoot.progress(1, "Baked in: " + manifest.mods.join(", "));
      }
      if (await digest(await blob.arrayBuffer()) !== manifest.sha256 && manifest.sha256) {
        throw new Error("the reassembled client does not match its hash");
      }
      frame.src = URL.createObjectURL(blob);
      frame.style.display = "block";
      start.style.display = "none";
      frame.focus();
      /* The client draws its own loading screen inside the iframe; our boot screen is already behind it
       * and has faded by the time the frame paints, so the hand-over is invisible. */
      if (window.webmcBoot) { window.webmcBoot.ready(); }
    } catch (error) {
      go.disabled = false;
      why.textContent = "could not start: " + (error && error.message ? error.message : error);
      why.className = "err";
    }
  }

  go.addEventListener("click", play);
  /* Autostart when the browser already has every chunk cached: no click needed, no download. */
  if (typeof caches !== "undefined") {
    caches.open("webmc-clients-v2").then(function () { return play(); }).catch(function () {});
  }
})();
</script>
