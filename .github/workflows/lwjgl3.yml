# The LWJGL 3 shim: the measurement, the skeleton, and (soon) a boot test.
#
# This is the engine work for 1.13 - 1.20.4: those versions need LWJGL 3, which has no JavaScript or
# WebAssembly implementation anywhere, so one has to be built. The job here keeps the skeleton honest:
# it rescans real clients, regenerates the classes from that measurement, and compiles them - so the
# work list can never drift from what the clients actually call.
name: LWJGL 3 shim

on:
  workflow_dispatch:
  push:
    paths:
      - "lwjgl3-webgl/**"
      - "tools/lwjgl3_surface.py"
      - "tools/lwjgl3_scaffold.py"
      - ".github/workflows/lwjgl3.yml"

permissions:
  contents: read

concurrency:
  group: webmc-port-lwjgl3
  cancel-in-progress: true

jobs:
  surface:
    name: Measure the surface and compile the shim
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Measure what 1.13, 1.16 and 1.20 ask of LWJGL 3
        run: |
          set -euo pipefail
          for version in 1.13.2 1.16.5 1.20.4; do
            python3 tools/lwjgl3_surface.py --version "$version" --out "work/surface-$version.json"
          done
          python3 tools/lwjgl3_surface.py \
            --jars work/client/1.13.2.jar,work/client/1.16.5.jar,work/client/1.20.4.jar --compare \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Regenerate the skeleton from that measurement
        run: |
          set -euo pipefail
          python3 tools/lwjgl3_scaffold.py \
            --surface work/surface-1.13.2.json \
            --surface work/surface-1.16.5.json \
            --surface work/surface-1.20.4.json \
            --merge --out lwjgl3-webgl | tee -a "$GITHUB_STEP_SUMMARY"
          if ! git diff --quiet lwjgl3-webgl; then
            echo "::warning::the committed skeleton is out of date with the measured surface"
            git diff --stat lwjgl3-webgl | tail -3
          fi

      - name: Compile the shim
        # No LWJGL jars needed: the shim provides those packages itself, which is the whole point -
        # it shadows the real LWJGL on the classpath.
        run: |
          set -euo pipefail
          mkdir -p /tmp/shim-classes
          find lwjgl3-webgl/src/main/java -name "*.java" > /tmp/sources.txt
          wc -l < /tmp/sources.txt
          javac -nowarn -d /tmp/shim-classes @/tmp/sources.txt && echo "the skeleton compiles"

      - name: Boot a Java program against the shim, in a real browser
        # This is the test that says the approach works: CheerpJ runs a Java program that opens a
        # window through our GLFW, draws through our GL, and reads a pixel back through our memory.
        # Headless Chrome with SwiftShader, because a runner has no GPU and software WebGL is enough.
        run: |
          set -euo pipefail
          mkdir -p /tmp/shimweb/classes
          find lwjgl3-webgl/src/main/java -name "*.java" > /tmp/sources.txt
          echo "lwjgl3-webgl/test/BootTest.java" >> /tmp/sources.txt
          javac -nowarn -d /tmp/shimweb/classes @/tmp/sources.txt
          cp lwjgl3-webgl/test/boot.html /tmp/shimweb/index.html
          cp -r lwjgl3-webgl/natives /tmp/shimweb/natives
          test -f /tmp/shimweb/natives/webmc-lwjgl3.js
          cd /tmp/shimweb && python3 -m http.server 8777 >/dev/null 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8777/index.html >/dev/null && echo "the test page is being served"

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          echo "chrome: $CHROME"
          # --dump-dom waits for the page to settle under a virtual clock; the page writes the result
          # into the DOM, which is how a browser with no console access reports back
          "$CHROME" --headless=new --no-sandbox --disable-gpu-sandbox --use-gl=angle \
            --use-angle=swiftshader --enable-unsafe-swiftshader --allow-file-access-from-files \
            --virtual-time-budget=120000 --dump-dom --disable-dev-shm-usage \
            http://127.0.0.1:8777/index.html > /tmp/dom.html 2>/tmp/chrome.err || true
          echo "--- what the page said ---"
          grep -oE "RESULT[^<]*" /tmp/dom.html || echo "(no RESULT line: the page did not finish)"
          grep -oE "<title>[^<]*</title>" /tmp/dom.html || true
          echo "--- the java log, if it got that far ---"
          grep -oE "BOOT [A-Z]+[^<]*" /tmp/dom.html | head -5 || true
          if grep -qE "RESULT code=0 frames=[1-9]" /tmp/dom.html; then
            echo "::notice::the loader booted and drew a frame in a real browser"
          else
            echo "::error::the loader did not boot; see the RESULT line above"
            tail -30 /tmp/chrome.err || true
            exit 1
          fi

      - name: Count what is still unimplemented
        run: |
          set -euo pipefail
          total=$(grep -rho "UnsupportedOperationException" lwjgl3-webgl/src/main/java | wc -l | tr -d " ")
          {
            echo "### LWJGL 3 shim"
            echo "- generated classes: $(find lwjgl3-webgl/src/main/java -name '*.java' | wc -l | tr -d ' ')"
            echo "- members still to implement: $total"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lwjgl3-skeleton
          path: lwjgl3-webgl/src/main/java
          retention-days: 7
