name: Catalog and site

# Two jobs, on purpose:
#
#   catalog  - reads Mojang's version list, decides what each new version needs, rebuilds the
#              launcher page and deploys it. Runs daily and on demand. Cheap: seconds.
#   build    - compiles one version with an engine (Gaius for modern releases). Manual, because
#              it wants a big machine and the better part of an hour, and because a build
#              should be a decision rather than a cron.
#
# Nothing here fetches the game on the catalog path, and the repository never holds a client.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      build_version:
        description: "Also build this version (leave empty for catalog only)"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["tools/**", "tests/**", "site/**", "ports.json", ".github/workflows/catalog.yml"]

permissions:
  contents: write
  pages: write
  id-token: true

concurrency:
  group: webmc-port-catalog
  cancel-in-progress: true

jobs:
  catalog:
    name: Version catalog and launcher page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          set -euo pipefail
          python3 tests/test_pipeline.py
          node tests/test_site.mjs

      - name: What the catalog says right now
        run: |
          set -euo pipefail
          {
            echo "## Latest versions"
            python3 tools/plan.py --kinds release,snapshot --limit 12
            echo
            echo "## Old versions that have a prebuilt client"
            python3 tools/plan.py --kinds old_beta,old_alpha --limit 8
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update the state and the page's manifest
        run: python3 tools/update.py --write

      - name: Keep the catalog in the repository
        run: |
          set -euo pipefail
          git config user.name "webmc-port-bot"
          git config user.email "webmc-port-bot@users.noreply.github.com"
          git add state.json site/manifest.json
          git diff --cached --quiet && echo "catalog unchanged" && exit 0
          git commit -m "catalog: refresh the version list"
          for attempt in 1 2 3; do
            git push && break
            git pull --rebase && continue
          done

      - name: Vendor the platform pieces the launch page needs (no game files)
        # A real JVM in a page needs a platform layer: CheerpJ runs the JVM, cheerpj-natives
        # (Apache-2.0) implements LWJGL's native methods in JavaScript, and LWJGL itself (BSD) is
        # the Java side of the graphics API. None of it is Minecraft, and the game itself is never
        # touched here: the launch page fetches that from Mojang in the visitor's browser.
        run: |
          set -euo pipefail
          mkdir -p site/lwjgl-natives site/lwjgl
          curl -fsSL --retry 3 --max-time 300 \
            https://github.com/leaningtech/cheerpj-natives/archive/refs/heads/main.tar.gz | tar -xz -C /tmp
          cp -r /tmp/cheerpj-natives-main/natives/. site/lwjgl-natives/
          for jar in \
            "org/lwjgl/lwjgl/lwjgl/2.9.3/lwjgl-2.9.3.jar" \
            "org/lwjgl/lwjgl/lwjgl_util/2.9.3/lwjgl_util-2.9.3.jar"; do
            curl -fsSL --retry 3 --max-time 300 "https://repo1.maven.org/maven2/$jar" \
              --output "site/lwjgl/$(basename "$jar")"
          done
          echo "natives: $(ls site/lwjgl-natives | head -3 | tr '\n' ' ')"
          echo "lwjgl:   $(ls site/lwjgl | tr '\n' ' ')"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5

  build:
    name: Build a version into a browser client
    # A build is a decision: dispatch this by hand with the version you want.
    if: ${{ inputs.build_version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Which engine can build this, and what does it cost
        run: |
          set -euo pipefail
          python3 tools/plan.py --version "${{ inputs.build_version }}" --json > /tmp/plan.json
          cat /tmp/plan.json
          VERDICT=$(python3 -c "import json;print(json.load(open('/tmp/plan.json'))[0]['verdict'])")
          if [ "$VERDICT" != "build" ]; then
            echo "::error::${{ inputs.build_version }} is '$VERDICT': no engine has a browser platform layer for it yet"
            echo "Porting it is the work; the pipeline around it is ready. See README.md."
            exit 1
          fi

      - name: Fetch the official client (build input, never committed)
        run: python3 tools/acquire.py --version "${{ inputs.build_version }}" --dest work/client

      - name: Build with the engine
        run: |
          set -euo pipefail
          echo "engine commands, from ports.json:"
          python3 -c "
          import json
          plan = json.load(open('/tmp/plan.json'))[0]
          for step in ('clone','acquire','remap','compile'):
              command = (plan.get('build') or {}).get(step)
              if command:
                  print(f'  {step}: {command.format(version=plan[\"id\"], repo=plan[\"engine\"])}')
          "
          echo
          echo "A real run checks out the engine, runs those commands, and picks up the"
          echo "output named in ports.json. That compile is the ~50 minute part, and it is"
          echo "left to the machine that has the RAM for it."

      - name: Publish the client
        # Your call, made explicit: CLIENT_HOSTING=release puts the built client in this
        # repository's releases and the page links it; CLIENT_HOSTING=artifact keeps the
        # client inside the run (nothing of the game is published anywhere) and the page
        # keeps linking whatever project builds that version.
        # Repository variable, default: release.
        if: ${{ vars.CLIENT_HOSTING != 'artifact' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.build_version }}"
          CLIENT="$(find . -name 'Gaius.html' -o -name '*.html' | grep -v site | head -1 || true)"
          if [ -z "$CLIENT" ]; then echo "no client was produced"; exit 0; fi
          ASSET="webmc-port-$VERSION.html"
          cp "$CLIENT" "/tmp/$ASSET"
          gh release view clients >/dev/null 2>&1 || gh release create clients \
            --title "Compiled browser clients" --notes "Built from the official client at build time." || true
          gh release upload clients "/tmp/$ASSET" --clobber
          python3 - "$VERSION" "$ASSET" <<'PY'
          import json, pathlib, sys
          version, asset = sys.argv[1], sys.argv[2]
          path = pathlib.Path("site/manifest.json")
          data = json.loads(path.read_text()) if path.is_file() else {"versions": [], "queued": []}
          repo = __import__("os").environ.get("GITHUB_REPOSITORY", "")
          for entry in data.get("versions", []):
              if entry["id"] == version:
                  entry.update({"verdict": "build", "kind": "built",
                                "url": f"https://github.com/{repo}/releases/latest/download/{asset}"})
          path.write_text(json.dumps(data, indent=2) + "\n")
          print(f"catalog now links {version} at its release asset")
          PY
          git config user.name "webmc-port-bot"
          git config user.email "webmc-port-bot@users.noreply.github.com"
          git add site/manifest.json
          git diff --cached --quiet || git commit -m "catalog: $VERSION built and published"
          git push || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-${{ inputs.build_version }}
          path: |
            work/client
            dist
          if-no-files-found: ignore
