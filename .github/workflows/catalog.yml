name: Catalog and site

# Two jobs, on purpose:
#
#   catalog  - reads Mojang's version list, decides what each new version needs, rebuilds the
#              launcher page and deploys it. Runs daily and on demand. Cheap: seconds.
#   build    - compiles one version with an engine (Gaius for modern releases). Manual, because
#              it wants a big machine and the better part of an hour, and because a build
#              should be a decision rather than a cron.
#
# Nothing here fetches the game on the catalog path, and the repository never holds a client.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      build_version:
        description: "Also build this version (leave empty for catalog only)"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["tools/**", "tests/**", "site/**", "ports.json", ".github/workflows/catalog.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Fast, page-refreshing work: a newer push should replace an older run. The long compile lives in
  # build-client.yml precisely so this can stay aggressive without killing a build.
  group: webmc-port-catalog
  cancel-in-progress: true

jobs:
  catalog:
    name: Version catalog and launcher page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          set -euo pipefail
          python3 tests/test_pipeline.py
          node tests/test_site.mjs

      - name: What the catalog says right now
        run: |
          set -euo pipefail
          {
            echo "## Latest versions"
            python3 tools/plan.py --kinds release,snapshot --limit 12
            echo
            echo "## Old versions that have a prebuilt client"
            python3 tools/plan.py --kinds old_beta,old_alpha --limit 8
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Classify what a browser JVM can run (the real-Java route)
        # One small request per version, cached in state.json, so the catalog converges over runs
        # instead of asking Mojang about 857 versions at once. This is what makes the launch route
        # cover the whole LWJGL-2 family rather than nine hand-picked versions.
        # Never fatal: if Mojang is unreachable the page should still deploy with the verdicts it
        # already has cached, and the next run picks up where this one stopped.
        run: |
          python3 tools/jvm_route.py --state state.json --limit 120 --write --print \
            || echo "::warning::could not classify any more versions this run; keeping the cache"

      - name: Vendor the libraries a version's client needs to start
        # 1.12.2 declares 37 libraries; handing the JVM two of them is why every version failed to
        # start. Deduplicated by sha1, so the pool grows far more slowly than the version count, and
        # site/libs is git-ignored: these are third-party jars, deployed but never committed.
        run: |
          # Releases first, newest first, then snapshots: these are what make a version start, and
          # the pool is deduplicated by sha1 so it grows far more slowly than the version count.
          python3 tools/vendor_libs.py --from-manifest site/manifest.json --limit 25 --out site/libs \
            || echo "::warning::could not vendor more libraries this run"
          du -sh site/libs 2>/dev/null || true

      - name: Check that every play link is alive and servable
        run: |
          python3 tools/check_links.py --state state.json --write --limit 60 \
            || echo "::warning::link check did not finish"

      - name: Refresh what Fabric supports (the launcher's Fabric column)
        # Two meta calls cover the whole catalogue. If the meta is down the fixture from the last
        # successful refresh is used, so the page degrades to slightly stale Fabric data instead of
        # losing the column.
        run: |
          set -euo pipefail
          python3 tools/fabric.py --out site/fabric.json --print \
            || { echo "::warning::fabric meta unreachable; keeping the committed site/fabric.json"; \
                 cp fixtures/fabric.json site/fabric.json; }

      - name: Update the state and the page's manifest
        run: python3 tools/update.py --strict-urls --write

      - name: Keep the catalog in the repository
        run: |
          set -euo pipefail
          git config user.name "webmc-port-bot"
          git config user.email "webmc-port-bot@users.noreply.github.com"
          git add state.json site/manifest.json site/fabric.json
          git diff --cached --quiet && echo "catalog unchanged" && exit 0
          git commit -m "catalog: refresh the version list"
          for attempt in 1 2 3; do
            git push && break
            git pull --rebase && continue
          done

      - name: Vendor the platform pieces the launch page needs (no game files)
        # A real JVM in a page needs a platform layer: CheerpJ runs the JVM, cheerpj-natives
        # (Apache-2.0) implements LWJGL's native methods in JavaScript, and LWJGL itself (BSD) is
        # the Java side of the graphics API. None of it is Minecraft, and the game itself is never
        # touched here: the launch page fetches that from Mojang in the visitor's browser.
        run: |
          set -euo pipefail
          mkdir -p site/lwjgl-natives site/lwjgl
          curl -fsSL --retry 3 --max-time 300 \
            https://github.com/leaningtech/cheerpj-natives/archive/refs/heads/main.tar.gz | tar -xz -C /tmp
          cp -r /tmp/cheerpj-natives-main/natives/. site/lwjgl-natives/
          for jar in \
            "org/lwjgl/lwjgl/lwjgl/2.9.3/lwjgl-2.9.3.jar" \
            "org/lwjgl/lwjgl/lwjgl_util/2.9.3/lwjgl_util-2.9.3.jar"; do
            curl -fsSL --retry 3 --max-time 300 "https://repo1.maven.org/maven2/$jar" \
              --output "site/lwjgl/$(basename "$jar")"
          done
          echo "natives: $(ls site/lwjgl-natives | head -3 | tr '\n' ' ')"
          echo "lwjgl:   $(ls site/lwjgl | tr '\n' ' ')"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
