name: Catalog and site

# Two jobs, on purpose:
#
#   catalog  - reads Mojang's version list, decides what each new version needs, rebuilds the
#              launcher page and deploys it. Runs daily and on demand. Cheap: seconds.
#   build    - compiles one version with an engine (Gaius for modern releases). Manual, because
#              it wants a big machine and the better part of an hour, and because a build
#              should be a decision rather than a cron.
#
# Nothing here fetches the game on the catalog path, and the repository never holds a client.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      build_version:
        description: "Also build this version (leave empty for catalog only)"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["tools/**", "tests/**", "site/**", "ports.json", ".github/workflows/catalog.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: webmc-port-catalog
  cancel-in-progress: true

jobs:
  catalog:
    name: Version catalog and launcher page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          set -euo pipefail
          python3 tests/test_pipeline.py
          node tests/test_site.mjs

      - name: What the catalog says right now
        run: |
          set -euo pipefail
          {
            echo "## Latest versions"
            python3 tools/plan.py --kinds release,snapshot --limit 12
            echo
            echo "## Old versions that have a prebuilt client"
            python3 tools/plan.py --kinds old_beta,old_alpha --limit 8
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update the state and the page's manifest
        run: python3 tools/update.py --strict-urls --write

      - name: Keep the catalog in the repository
        run: |
          set -euo pipefail
          git config user.name "webmc-port-bot"
          git config user.email "webmc-port-bot@users.noreply.github.com"
          git add state.json site/manifest.json
          git diff --cached --quiet && echo "catalog unchanged" && exit 0
          git commit -m "catalog: refresh the version list"
          for attempt in 1 2 3; do
            git push && break
            git pull --rebase && continue
          done

      - name: Vendor the platform pieces the launch page needs (no game files)
        # A real JVM in a page needs a platform layer: CheerpJ runs the JVM, cheerpj-natives
        # (Apache-2.0) implements LWJGL's native methods in JavaScript, and LWJGL itself (BSD) is
        # the Java side of the graphics API. None of it is Minecraft, and the game itself is never
        # touched here: the launch page fetches that from Mojang in the visitor's browser.
        run: |
          set -euo pipefail
          mkdir -p site/lwjgl-natives site/lwjgl
          curl -fsSL --retry 3 --max-time 300 \
            https://github.com/leaningtech/cheerpj-natives/archive/refs/heads/main.tar.gz | tar -xz -C /tmp
          cp -r /tmp/cheerpj-natives-main/natives/. site/lwjgl-natives/
          for jar in \
            "org/lwjgl/lwjgl/lwjgl/2.9.3/lwjgl-2.9.3.jar" \
            "org/lwjgl/lwjgl/lwjgl_util/2.9.3/lwjgl_util-2.9.3.jar"; do
            curl -fsSL --retry 3 --max-time 300 "https://repo1.maven.org/maven2/$jar" \
              --output "site/lwjgl/$(basename "$jar")"
          done
          echo "natives: $(ls site/lwjgl-natives | head -3 | tr '\n' ' ')"
          echo "lwjgl:   $(ls site/lwjgl | tr '\n' ' ')"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5

  build:
    name: Build a version into a browser client
    # A build is a decision: dispatch this by hand with the version you want. The engine for 26.2 is
    # the Eaglercraft workspace, whose npm entry point does the work: gradle compiles the patched
    # client with Java 25, the wasm toolchain links it, and build-single-html.js packages one HTML.
    if: ${{ inputs.build_version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          path: ours

      - name: Which engine can build this, and what it needs
        run: |
          set -euo pipefail
          cd ours
          python3 tools/plan.py --version "${{ inputs.build_version }}" --json > /tmp/plan.json
          python3 -c "
          import json
          plan = json.load(open('/tmp/plan.json'))[0]
          print('verdict:', plan['verdict'], '| engine:', plan['engine'], '|', plan['why'])
          for key, value in (plan.get('build') or {}).items():
              print(f'  {key}: {value.format(version=plan[\"id\"], repo=plan[\"engine\"])}')
          "
          VERDICT=$(python3 -c "import json;print(json.load(open('/tmp/plan.json'))[0]['verdict'])")
          [ "$VERDICT" = "build" ] || {
            echo "::error::${{ inputs.build_version }} is '$VERDICT': no enabled engine has a profile for it"
            exit 1
          }

      - name: Check out the engine
        uses: actions/checkout@v7
        with:
          repository: CynTheSolveroftheabsolutefabric/Eaglercraft-26.2-Workspace
          path: engine
          fetch-depth: 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Compile, link and package the client
        # ~40 minutes, ~10 GiB of heap. The tail is kept because that is where a TeaVM or gradle
        # failure states its reason.
        run: |
          set -euo pipefail
          cd engine
          node --version
          java -version 2>&1 | head -2
          free -h | head -2
          npm install --no-audit --no-fund 2>&1 | tail -5
          export GRADLE_OPTS="-Xmx10g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
          export NODE_OPTIONS="--max-old-space-size=6144"
          ( while true; do sleep 60; free -h | awk 'NR==2 {print "  memory: " $3 " / " $2}'; done ) &
          WATCH=$!
          set +e
          npm run build:single -- --output "dist/${{ inputs.build_version }}.html" 2>&1 | tail -120
          STATUS=${PIPESTATUS[0]}
          set -e
          kill $WATCH 2>/dev/null || true
          echo "build exit status: $STATUS"
          echo "$STATUS" > /tmp/build-status

      - name: What came out
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Build ${{ inputs.build_version }}"
            echo '```'
            find engine -name '*.html' -size +1M -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -5 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish the client as a launcher card
        # CLIENT_HOSTING=release (default) uploads the built client to this repository's releases and
        # the page links it; CLIENT_HOSTING=artifact keeps it inside the run, so nothing of the game
        # is published anywhere and the page keeps linking the port that already exists.
        if: ${{ vars.CLIENT_HOSTING != 'artifact' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd ours
          VERSION="${{ inputs.build_version }}"
          CLIENT=$(find ../engine -name '*.html' -size +5M | sort | head -1 || true)
          if [ -z "$CLIENT" ]; then echo "no client produced, nothing to publish"; exit 0; fi
          ASSET="client-$VERSION.html"
          cp "$CLIENT" "/tmp/$ASSET"
          echo "publishing $ASSET ($(du -h "/tmp/$ASSET" | cut -f1))"
          gh release view built-clients >/dev/null 2>&1 || gh release create built-clients \
            --title "Built browser clients" --notes "Compiled from the official client by this repository's build job." || true
          gh release upload built-clients "/tmp/$ASSET" --clobber
          python3 - "$VERSION" "$ASSET" <<'PY'
          import json, os, pathlib, sys
          version, asset = sys.argv[1], sys.argv[2]
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          path = pathlib.Path("site/manifest.json")
          data = json.loads(path.read_text()) if path.is_file() else {"versions": [], "queued": []}
          url = f"https://github.com/{repo}/releases/latest/download/{asset}"
          hit = False
          for entry in data.get("versions", []):
              if entry["id"] == version:
                  entry["url"] = url
                  entry["kind"] = "built"
                  hit = True
          print("catalog updated for", version if hit else f"{version} (not in the catalog yet)")
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          git config user.name "webmc-port-bot"
          git config user.email "webmc-port-bot@users.noreply.github.com"
          git add site/manifest.json
          git diff --cached --quiet || git commit -m "catalog: $VERSION built and published"
          git push || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-${{ inputs.build_version }}
          path: |
            engine/*.html
            engine/dist
            engine/build
          if-no-files-found: ignore
