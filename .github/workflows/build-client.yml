# Compile one version into a browser client.
#
# This is the older entry point (a version an engine already has a profile for); the work is done by
# build-snapshot.yml, which is a reusable workflow, so the engine chain exists in exactly one place.
# It can also generate a profile for a version nobody has brought up yet - see `tools/aot_snapshot.py`.
#
# The default engine is TypeThe0ry/Gaius, which is **MIT licensed**. That matters: an engine is somebody
# else's source tree, and a repository with no licence file means all rights reserved, not "free to
# use" - so the engine this job builds from is named here rather than left to chance.
name: Build a client

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Minecraft version to compile (or latest-snapshot / latest-release)"
        required: true
        type: string
      engine_repo:
        description: "Engine to compile from (default: the MIT-licensed one)"
        required: false
        type: string
        default: "TypeThe0ry/Gaius"
      bringup:
        description: "Allow the engine's bring-up list"
        required: false
        type: boolean
        default: true
  push:
    # A tag is a deliberate act, which is what a long build should take to start.
    tags: ["build-*"]

permissions:
  contents: write

concurrency:
  group: webmc-port-build
  cancel-in-progress: false

jobs:
  build:
    name: Compile a version into a browser client
    uses: ./.github/workflows/build-snapshot.yml
    with:
      version: ${{ inputs.build_version || github.ref_name }}
      engine_repo: ${{ inputs.engine_repo || 'TypeThe0ry/Gaius' }}
      bringup: ${{ inputs.bringup }}
    secrets: inherit
