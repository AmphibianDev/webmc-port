# Compiling a version: the long job, on purpose in its own workflow.
#
# It used to live inside catalog.yml, which runs on every push with cancel-in-progress - so pushing
# anything killed a build that had been running for half an hour. This workflow is dispatched by hand,
# never cancelled by a push, and never cancels itself: two builds at once would fight over 16 GB of
# runner memory for nothing.
name: Build a client

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Minecraft version to compile (must be a version the plan says is buildable)"
        required: true
        type: string
      engine_repo:
        description: "Workspace to compile from (defaults to the engine the plan names)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: webmc-port-build
  cancel-in-progress: false

jobs:
  build:
    name: Build a version into a browser client
    # A build is a decision: dispatch this by hand with the version you want. The engine for 26.2 is
    # the Eaglercraft workspace, whose npm entry point does the work: gradle compiles the patched
    # client with Java 25, the wasm toolchain links it, and build-single-html.js packages one HTML.
    if: ${{ inputs.build_version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          path: ours

      - name: Which engine can build this, and what it needs
        # With engine_repo given, a workspace nobody has wired up yet can be built anyway: the plan is
        # asked for its advice rather than its permission. That is how a version with no port and no
        # engine entry - a fresh snapshot, a new release - gets built the day a workspace appears.
        if: ${{ inputs.engine_repo == '' }}
        run: |
          set -euo pipefail
          cd ours
          python3 tools/plan.py --version "${{ inputs.build_version }}" --json > /tmp/plan.json
          python3 -c "
          import json
          plan = json.load(open('/tmp/plan.json'))[0]
          print('verdict:', plan['verdict'], '| engine:', plan['engine'], '|', plan['why'])
          for key, value in (plan.get('build') or {}).items():
              print(f'  {key}: {value.format(version=plan[\"id\"], repo=plan[\"engine\"])}')
          "
          VERDICT=$(python3 -c "import json;print(json.load(open('/tmp/plan.json'))[0]['verdict'])")
          [ "$VERDICT" = "build" ] || {
            echo "::error::${{ inputs.build_version }} is '$VERDICT': no enabled engine has a profile for it"
            exit 1
          }

      - name: Check out the engine
        uses: actions/checkout@v7
        with:
          repository: CynTheSolveroftheabsolutefabric/Eaglercraft-26.2-Workspace
          repository: ${{ inputs.engine_repo != '' && inputs.engine_repo || 'CynTheSolveroftheabsolutefabric/Eaglercraft-26.2-Workspace' }}
          path: engine
          fetch-depth: 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Pack the audio archives the engine needs
        # The packager reads sounds.epk unconditionally and fails without it, but that file is the
        # official Minecraft audio: the engine's own skeleton manifest lists it under
        # "external_inputs_required ... from a separately authorized, hash-pinned source". We have no
        # licence to redistribute it and cannot rebuild it from source, so this writes a valid but
        # EMPTY archive using the engine's own packager (their EPKCompiler writes it, their
        # EPKDecompiler verifies it). The client fetches the real audio at play time through its
        # in-game "Get game audio" button instead. See tools/empty-epk.init.gradle.kts.
        working-directory: engine
        run: |
          set -euo pipefail
          # The archives have to exist, and the optional music-pack export (which runs
          # unconditionally at the end of the build) needs at least one entry whose name starts with
          # assets/minecraft/sounds/music/ or .../records/ - it is a name filter, not an audio check.
          # So: one placeholder text file in each, and no Minecraft audio anywhere. What this build
          # produces is a client without bundled sound or music; the in-game "Get game audio" button
          # fetches the real thing, and the music pack is optional by design.
          mkdir -p /tmp/webmc-empty-epk/assets/minecraft/sounds/music/menu
          printf 'This archive is a placeholder: WebMC bundles no Minecraft audio.\nThe client fetches audio at play time; nothing here is a sound file.\n' \
            > /tmp/webmc-empty-epk/WEBMC-NO-AUDIO.txt
          cp /tmp/webmc-empty-epk/WEBMC-NO-AUDIO.txt \
             /tmp/webmc-empty-epk/assets/minecraft/sounds/music/menu/WEBMC-NO-MUSIC.txt
          ./gradlew -I "$GITHUB_WORKSPACE/ours/tools/empty-epk.init.gradle.kts" \
            :target_lwjgl_desktop:packEmptySounds \
            :target_lwjgl_desktop:packEmptyMusic \
            --console=plain --no-daemon 2>&1 | tail -20
          ls -l target_teavm/build/web/*.epk

      - name: Compile, link and package the client
        # ~40 minutes, ~10 GiB of heap. The tail is kept because that is where a TeaVM or gradle
        # failure states its reason.
        run: |
          set -euo pipefail
          cd engine
          node --version
          java -version 2>&1 | head -2
          free -h | head -2
          npm install --no-audit --no-fund 2>&1 | tail -5
          export GRADLE_OPTS="-Xmx10g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
          export NODE_OPTIONS="--max-old-space-size=6144"
          ( while true; do sleep 60; free -h | awk 'NR==2 {print "  memory: " $3 " / " $2}'; done ) &
          WATCH=$!
          set +e
          npm run build:single -- --output "dist/${{ inputs.build_version }}.html" 2>&1 | tail -120
          STATUS=${PIPESTATUS[0]}
          set -e
          kill $WATCH 2>/dev/null || true
          echo "build exit status: $STATUS"
          echo "$STATUS" > /tmp/build-status
          # A build that failed must fail the job. The first run of this job reported success while
          # the toolchain had exited 1 and produced nothing, because the status was only echoed.
          if [ "$STATUS" != "0" ]; then
            echo "::error::the toolchain exited $STATUS (tail above)"
            exit 1
          fi

      - name: What came out
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Build ${{ inputs.build_version }}"
            echo '```'
            find engine -name '*.html' -size +1M -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -5 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish the client as a launcher card
        # CLIENT_HOSTING=release (default) uploads the built client to this repository's releases and
        # the page links it; CLIENT_HOSTING=artifact keeps it inside the run, so nothing of the game
        # is published anywhere and the page keeps linking the port that already exists.
        if: ${{ vars.CLIENT_HOSTING != 'artifact' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd ours
          VERSION="${{ inputs.build_version }}"
          CLIENT=$(find ../engine -name '*.html' -size +5M | sort | head -1 || true)
          # Exiting 0 here hid the first failed build: nothing was published, yet the job was green.
          if [ -z "$CLIENT" ]; then echo "::error::the toolchain produced no client to publish"; exit 1; fi
          ASSET="client-$VERSION.html"
          cp "$CLIENT" "/tmp/$ASSET"
          echo "publishing $ASSET ($(du -h "/tmp/$ASSET" | cut -f1))"
          gh release view built-clients >/dev/null 2>&1 || gh release create built-clients \
            --title "Built browser clients" --notes "Compiled from the official client by this repository's build job." || true
          gh release upload built-clients "/tmp/$ASSET" --clobber
          python3 - "$VERSION" "$ASSET" <<'PY'
          import json, os, pathlib, sys
          version, asset = sys.argv[1], sys.argv[2]
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          path = pathlib.Path("site/manifest.json")
          data = json.loads(path.read_text()) if path.is_file() else {"versions": [], "queued": []}
          url = f"https://github.com/{repo}/releases/latest/download/{asset}"
          hit = False
          for entry in data.get("versions", []):
              if entry["id"] == version:
                  entry["url"] = url
                  entry["kind"] = "built"
                  hit = True
          print("catalog updated for", version if hit else f"{version} (not in the catalog yet)")
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          # state.json is where the catalogue keeps what it knows; the manifest is generated from it.
          python3 - "$VERSION" "$ASSET" <<'PYSTATE'
          import hashlib, json, os, pathlib, sys
          version, asset = sys.argv[1], sys.argv[2]
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          path = pathlib.Path("state.json")
          state = json.loads(path.read_text()) if path.is_file() else {"seen": [], "catalog": []}
          blob = pathlib.Path("/tmp", asset)
          state.setdefault("built", {})[version] = {
              "url": f"https://github.com/{repo}/releases/latest/download/{asset}",
              "bytes": blob.stat().st_size if blob.is_file() else None,
              "sha256": hashlib.sha256(blob.read_bytes()).hexdigest() if blob.is_file() else None,
              "at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc)
                    .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "note": "compiled by build-client.yml from the official client",
          }
          path.write_text(json.dumps(state, indent=2) + "\n")
          print("state.json now records the built client for", version)
          PYSTATE
          python3 tools/update.py --state state.json --write
          git config user.name "webmc-port-bot"
          git config user.email "webmc-port-bot@users.noreply.github.com"
          git add state.json site/manifest.json
          git diff --cached --quiet || git commit -m "catalog: $VERSION built and published"
          git push || echo "::warning::could not push the catalog update; the next run will"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-${{ inputs.build_version }}
          path: |
            engine/*.html
            engine/dist
            engine/build
          if-no-files-found: ignore
